services:
  llm-service:
    build:
      context: ./kisaan-llm-service
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma2:2b
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    volumes:
      - ./kisaan-llm-service/data:/app/data
      - ./kisaan-llm-service/vectorstore:/app/vectorstore
    restart: unless-stopped

  backend:
    build:
      context: ./kisaan-backend
    env_file:
      - ./kisaan-backend/.env
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      BASE_URL: http://localhost:5000
      LLM_SERVICE_URL: http://llm-service:8000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5000,http://127.0.0.1:8080,http://127.0.0.1:5000
    volumes:
      - ./kisaan-backend/uploads:/app/uploads
      - ./kisaan-backend/ai_models/disease:/app/ai_models/disease
    depends_on:
      - llm-service
    restart: unless-stopped

  frontend:
    build:
      context: ./kisaan-frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - backend
      - llm-service
    restart: unless-stopped
